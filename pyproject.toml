[project]
name = "ihcinfer"
version = "0.2.1"
description = "Fast patch-based immunohistochemistry (IHC) inference library for whole-slide images (SVS/KFB), powered by DeepLIIF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yifan Feng" }
]
keywords = ["DeepLIIF", "IHC", "immunohistochemistry", "WSI", "SVS", "KFB", "segmentation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "numpy>=1.21,<3",
    "Pillow>=9.0",
    "pandas>=1.3",
    "openslide-python>=1.3",
    "openslide-bin>=4.0",
    "opencv-python-headless>=4.5",
    "scikit-image>=0.20.0",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ihc = "ihcinfer.cli:main"

[project.urls]
Homepage = "https://github.com/yifanfeng97/ihcinfer"
Repository = "https://github.com/yifanfeng97/ihcinfer"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ihcinfer",
    "ihcinfer.inference",
    "ihcinfer.models",
    "ihcinfer.outputs",
    "ihcinfer.prep",
    "ihcinfer.readers",
    "ihcinfer.scoring",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (run with '-m slow' or 'pytest --override-ini=addopts=')"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "matplotlib>=3.5",
]
